name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize project structure
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            SUBDIR=$(find . -name package.json -not -path "*/node_modules/*" | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              shopt -s dotglob; mv "$SUBDIR"/* .; rmdir "$SUBDIR" 2>/dev/null || true
              echo "Flattened to root:" && ls
            else
              echo "::error::package.json not found"; exit 1
            fi
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci || npm install
      - run: npm run test:run
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spending-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
